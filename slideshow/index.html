<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahime Slideshow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #023a6b, #0050a0);
    }
    .swiper {
      width: 100%;
      height: 100%;
    }
    .swiper-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #023a6b, #0050a0);
      padding: 16px;
    }
    .slide-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.95;
    }
    .slide-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .swiper-pagination-bullet {
      background: #ffffff;
      opacity: 0.4;
    }
    .swiper-pagination-bullet-active {
      background: #35d852;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="slide-icon">🚌</div>
        <div class="slide-title">Transport</div>
      </div>
      <div class="swiper-slide">
        <div class="slide-icon">🏨</div>
        <div class="slide-title">Hôtel</div>
      </div>
      <div class="swiper-slide">
        <div class="slide-icon">🔧</div>
        <div class="slide-title">Artisan</div>
      </div>
      <div class="swiper-slide">
        <div class="slide-icon">🏢</div>
        <div class="slide-title">Immobilier</div>
      </div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.swiper', {
      effect: 'slide',
      loop: true,
      grabCursor: true,
      autoplay: { delay: 2500, disableOnInteraction: false },
      speed: 600,
      pagination: { el: '.swiper-pagination', clickable: true },
    });
  </script>
</body>
</html>
