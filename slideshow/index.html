<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahime Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #023a6b, #0050a0);
    }
    .slider {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }
    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #023a6b, #0050a0);
      padding: 16px;
    }
    .slide img {
      width: 100%;
      max-width: 320px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      user-select: none;
      -webkit-user-drag: none;
    }
    .slide-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.3s;
      border: none;
      padding: 0;
    }
    .dot:hover { transform: scale(1.2); }
    .dot.active {
      opacity: 1;
      background: #35d852;
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div class="slider" id="slider">
    <div class="slides" id="slides">
      <div class="slide">
        <img src="Slash.jpeg" alt="Transport">
        <div class="slide-title">Transport</div>
      </div>
      <div class="slide">
        <img src="Slash.jpeg" alt="Hôtel">
        <div class="slide-title">Hôtel</div>
      </div>
      <div class="slide">
        <img src="Slash.jpeg" alt="Artisan">
        <div class="slide-title">Artisan</div>
      </div>
      <div class="slide">
        <img src="Slash.jpeg" alt="Immobilier">
        <div class="slide-title">Immobilier</div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <script src="slider.js"></script>
</body>
</html>
