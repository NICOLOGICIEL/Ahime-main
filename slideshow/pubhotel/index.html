<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahime Slideshow - Hôtel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #023a6b, #0050a0);
    }

    .slider {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .slides {
      display: flex;
      width: 100vw;
      height: 100vh;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .slide {
      min-width: 100vw;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      background: linear-gradient(135deg, #023a6b, #0050a0);
      padding: 0;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .slide img {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slide-title {
      display: none;
    }

    .dots {
      display: none;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.3s;
      border: none;
      padding: 0;
    }

    .dot:hover {
      transform: scale(1.2);
    }

    .dot.active {
      opacity: 1;
      background: #35d852;
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <div class="slider" id="slider">
    <div class="slides" id="slides">
      <div class="slide">
        <img src="Slash.jpeg" alt="Hôtel">
        <div class="slide-title">Hôtel</div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <script src="../slider.js"></script>
</body>

</html>
